name: release-gates

# The gates in tools/gates/ answer "did this artifact survive the checks?".
# Before this workflow nothing invoked them, so a gate only ran when a human
# remembered the command. This job is that invocation.
#
# What it grades here, and what it cannot:
#
#   netlist_parity     runs. It needs no KiCad, only the two committed exports
#                      plus pin-net-map.csv, and it grades the XML and the
#                      S-expression netlist against one expected map.
#   native_reports     NOT RUN on this runner: there is no .kicad_pcb in the
#                      tree (the design is schematic-only) and no kicad-cli.
#                      The gate says so with an explicit reason; it is not
#                      silently skipped and it is not faked.
#   release_manifest   NOT RUN: there is no release manifest and no Gerber
#                      packet to inventory.
#
# So a green run means exactly "the netlist parity gate graded both exports and
# passed", and the job summary lists the two gates that did not run with their
# reasons. It is not a fabrication approval and not an ERC/DRC result.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    name: fail-closed gate suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PyYAML is used by the workflow-contract tests in tests/gates/.
      - name: Install test dependencies
        run: pip install --no-cache-dir pytest pyyaml

      # ngspice is required, not optional. Two hardware suites raise
      # RuntimeError rather than skipping when it is missing, so a runner
      # without it fails rather than reporting a green lane it never graded.
      # Deliberately NOT `|| true`: a missing simulator must be loud.
      - name: Install ngspice
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq ngspice
          ngspice --version | head -1

      - name: Gate suite self-tests
        run: python3 -m pytest tests/gates -q

      # The next three suites existed and passed locally but no workflow ran
      # them, so a regression in the schematic, the analysis models or the
      # SPICE decks would have merged green. They are separate steps so the
      # failing suite is named in the summary rather than inferred from one
      # composite exit code.
      #
      # PYTHONPATH is set per suite because both trees use flat imports
      # (`import model`, `import verify_exports`) rather than packages, so a
      # single root-level invocation cannot collect them.
      - name: Hardware suite (schematic, netlist, calculators, SPICE)
        env:
          PYTHONPATH: hardware/powerboard-reva
        run: python3 -m pytest hardware/powerboard-reva/tests -q

      - name: Analysis suite (closed-form budgets and corner sweeps)
        env:
          PYTHONPATH: .
        run: |
          set -e
          # The analysis tree has several modules named `model.py` and
          # `test_model.py` at sibling paths, so a single `pytest analysis`
          # aborts on duplicate basenames. Each directory is collected on its
          # own instead; a bare root invocation is not "more thorough", it just
          # fails collection.
          for d in analysis/*/; do
            if ls "$d"test_*.py >/dev/null 2>&1 || ls "$d"tests/*.py >/dev/null 2>&1; then
              echo "--- $d"
              PYTHONPATH="$d" python3 -m pytest "$d" -q
            fi
          done

      - name: Run the release gates
        env:
          PYTHONPATH: .
        # --ci means "NOT RUN is reported, not fatal, because this runner cannot
        # produce the artifact"; FAIL is never relaxed. No `|| true`, no
        # continue-on-error: the step's exit code is the job's verdict.
        run: |
          set -e
          python3 tools/gates/run_release_gates.py --ci \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --json-out gate-summary.json

      - name: Upload the aggregate payload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gates-aggregate
          path: |
            gate-summary.json
          if-no-files-found: ignore
          retention-days: 14
